services:
  - type: web
    name: home-analysis-api
    runtime: python
    plan: starter
    buildCommand: python -m compileall -q server.py
    startCommand: python server.py
    healthCheckPath: /health
    disk:
      name: analysis-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ANALYSIS_API_ONLY
        value: "1"
      - key: ANALYSIS_INGEST_API_KEY
        generateValue: true
      - key: HOME_CONTROL_HOST
        value: 0.0.0.0
      - key: HOME_CONTROL_LOG_PATH
        value: /var/data/logs.json
      - key: HOME_CONTROL_ALLOWED_ORIGINS
        sync: false
